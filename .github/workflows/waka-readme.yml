name: Waka Readme

on:
  workflow_dispatch:   # for manual workflow trigger
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC (00:00 по Москве)

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: avnovik/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true 
          SECTION_NAME: waka
          BLOCKS: ->
          CODE_LANG: java
          TIME_RANGE: last_6_months
          LANG_COUNT: 10
          SHOW_TIME: true
          SHOW_TOTAL: true
          STOP_AT_OTHER: true
